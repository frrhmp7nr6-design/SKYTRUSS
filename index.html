<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SKYTRUSS" />
  <link id="apple-icon" rel="apple-touch-icon" sizes="512x512" href="" />
  <link rel="icon" type="image/webp" href="./images/skytruss.webp" />
  <link id="pwa-manifest" rel="manifest" href="" />
  <title>SKYTRUSS</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-void: #07090d;
      --crimson: #dc2626;
      --crimson-glow: rgba(220, 38, 38, 0.45);
      --text: #f8fafc;
      --muted: rgba(226, 232, 240, 0.72);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100dvh;
      overflow: hidden; overscroll-behavior: none;
      background: var(--bg-void); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }
    input { user-select: text; -webkit-user-select: text; font-size: 16px !important; }
    button {
      cursor: pointer; font-family: inherit; border: none; font-weight: 700;
      min-height: 46px; transition: transform 0.12s ease, filter 0.15s ease;
    }
    button:active { transform: scale(0.97); }
    .hidden { display: none !important; }

    /* FULL-BLEED ARTWORK WITH INTEGRATED FROSTED CONTROLS */
    #login-wall {
      position: relative;
      width: 100%; height: 100dvh;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      background: url("./images/login.webp") center 28% / cover no-repeat;
      padding:
        calc(20px + env(safe-area-inset-top))
        calc(22px + env(safe-area-inset-right))
        calc(34px + env(safe-area-inset-bottom))
        calc(22px + env(safe-area-inset-left));
    }

    /* Soft vignette & progressive blur along the bottom where the inputs sit */
    #login-wall::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(7, 9, 13, 0.05) 0%,
        rgba(7, 9, 13, 0.25) 52%,
        rgba(7, 9, 13, 0.78) 84%,
        rgba(7, 9, 13, 0.92) 100%
      );
      z-index: 1;
    }

    @media (min-width: 700px) {
      #login-wall {
        background-position: center center;
        padding-bottom: 48px;
      }
    }

    /* Borderless floating form container directly over the image */
    .login-stack {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      padding-left: 4px;
    }

    /* Frosted glass inputs that blur the artwork directly behind them */
    .field input {
      width: 100%;
      min-height: 48px;
      padding: 12px 15px;
      border-radius: 12px;
      background: rgba(12, 16, 24, 0.42);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #ffffff;
      outline: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .field input::placeholder {
      color: rgba(203, 213, 225, 0.48);
    }

    .field input:focus {
      background: rgba(12, 16, 24, 0.62);
      border-color: rgba(239, 68, 68, 0.75);
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.22), 0 8px 24px rgba(0, 0, 0, 0.55);
    }

    .btn-signin {
      width: 100%;
      margin-top: 4px;
      border-radius: 12px;
      font-size: 15px;
      letter-spacing: 0.6px;
      color: #ffffff;
      background: linear-gradient(135deg, rgba(220, 38, 38, 0.88), rgba(153, 27, 27, 0.92));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(248, 113, 113, 0.35);
      box-shadow: 0 10px 28px var(--crimson-glow);
    }

    .mode-toggle {
      background: none;
      border: none;
      min-height: 32px;
      padding: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
    }

    .mode-toggle span {
      color: #f87171;
      text-decoration: underline;
    }

    .status-msg {
      font-size: 12px;
      min-height: 16px;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
    }

    /* POST-LOGIN SHELL */
    #main-scene {
      width: 100%; height: 100dvh; display: flex; flex-direction: column;
      background: radial-gradient(circle at 50% 20%, #1a1216 0%, #07090d 75%);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    .scene-topbar {
      height: 54px; padding: 0 14px; background: rgba(10, 12, 18, 0.92);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      flex-shrink: 0;
    }
    .btn-ghost {
      background: rgba(255,255,255,0.08); color: var(--text);
      border: 1px solid rgba(255,255,255,0.15); padding: 8px 14px; border-radius: 10px;
      font-size: 13px; min-height: 38px;
    }
    .main-body {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; text-align: center; overflow-y: auto;
    }
  </style>
</head>
<body>
  <!-- LOGIN WALL -->
  <div id="login-wall">
    <div class="login-stack">
      <div class="field">
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="field">
        <label for="auth-pass">Password</label>
        <input type="password" id="auth-pass" placeholder="Min 6 characters" autocomplete="current-password" />
      </div>

      <button class="btn-signin" id="auth-submit" onclick="handleAuth()">Sign In</button>

      <button type="button" class="mode-toggle" id="mode-toggle-btn" onclick="toggleAuthMode()">
        Need an account? <span>Create Account</span>
      </button>

      <div class="status-msg" id="auth-status"></div>
    </div>
  </div>

  <!-- POST-LOGIN SHELL -->
  <div id="main-scene" class="hidden">
    <div class="scene-topbar">
      <div style="display:flex; align-items:center; gap:8px;">
        <img src="./images/skytruss.webp" alt="SKYTRUSS" style="width:28px; height:28px; border-radius:6px;" />
        <strong style="color:#f87171; font-size:16px; letter-spacing:1px;">SKYTRUSS</strong>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:12px; color:var(--muted); max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" id="user-display-name"></span>
        <button class="btn-ghost" onclick="signOutUser()">Sign Out</button>
      </div>
    </div>

    <div class="main-body">
      <h2 style="margin:0 0 8px;">Signed in to SKYTRUSS</h2>
      <p style="color:var(--muted); font-size:14px; max-width:340px;">
        Supabase session active. Ready to build the main SKYTRUSS screen next.
      </p>
    </div>
  </div>

  <script>
    // CONVERT ./images/skytruss.webp TO 512x512 PNG FOR iOS SAFARI HOME SCREEN ICON
    (function setupPWAIconAndManifest() {
      const img = new Image();
      img.onload = function () {
        const c = document.createElement("canvas");
        c.width = 512;
        c.height = 512;
        const ctx = c.getContext("2d");
        ctx.drawImage(img, 0, 0, 512, 512);
        const pngUrl = c.toDataURL("image/png");

        const appleLink = document.getElementById("apple-icon");
        if (appleLink) appleLink.href = pngUrl;

        const manifest = {
          name: "SKYTRUSS",
          short_name: "SKYTRUSS",
          start_url: "./",
          display: "standalone",
          background_color: "#07090d",
          theme_color: "#07090d",
          icons: [{ src: pngUrl, sizes: "512x512", type: "image/png" }]
        };
        const manifestLink = document.getElementById("pwa-manifest");
        if (manifestLink) {
          manifestLink.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest));
        }
      };
      img.src = "./images/skytruss.webp";
    })();

    // SUPABASE CREDENTIALS
    const SUPABASE_URL = "https://fwpnbbkyhugzppclsgbl.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_QU5rvS7F-VfmocfgP1SqKw_gymqv9bQ";
    const sb = SUPABASE_URL.startsWith("http") ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    let authMode = "login";

    function toggleAuthMode() {
      authMode = authMode === "login" ? "signup" : "login";
      const isSignup = authMode === "signup";
      document.getElementById("auth-submit").textContent = isSignup ? "Create Account" : "Sign In";
      document.getElementById("auth-pass").setAttribute("autocomplete", isSignup ? "new-password" : "current-password");
      document.getElementById("mode-toggle-btn").innerHTML = isSignup
        ? 'Already have an account? <span>Sign In</span>'
        : 'Need an account? <span>Create Account</span>';
      setStatus("");
    }

    function setStatus(msg, err = false) {
      const el = document.getElementById("auth-status");
      el.style.color = err ? "#f87171" : "#4ade80";
      el.textContent = msg;
    }

    async function handleAuth() {
      if (!sb) return setStatus("Missing Supabase keys.", true);
      const email = document.getElementById("auth-email").value.trim();
      const password = document.getElementById("auth-pass").value;

      if (!email || password.length < 6) {
        return setStatus("Enter a valid email and 6+ char password.", true);
      }

      setStatus("Connecting...");
      const res = authMode === "signup"
        ? await sb.auth.signUp({
            email,
            password,
            options: { data: { display_name: email.split("@")[0] } }
          })
        : await sb.auth.signInWithPassword({ email, password });

      if (res.error) return setStatus(res.error.message, true);
      if (res.data?.user) onSignedIn(res.data.user);
    }

    function onSignedIn(u) {
      if (!u) return;
      document.getElementById("user-display-name").textContent = u.user_metadata?.display_name || u.email.split("@")[0];
      document.getElementById("login-wall").classList.add("hidden");
      document.getElementById("main-scene").classList.remove("hidden");
    }

    async function signOutUser() {
      if (sb) await sb.auth.signOut();
      document.getElementById("main-scene").classList.add("hidden");
      document.getElementById("login-wall").classList.remove("hidden");
      setStatus("");
    }

    // AUTO-RESTORE SESSION ON LAUNCH
    (async () => {
      if (!sb) return;
      const { data } = await sb.auth.getSession();
      if (data?.session?.user) onSignedIn(data.session.user);
    })();
  </script>
</body>
</html>
