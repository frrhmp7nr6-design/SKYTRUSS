<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SKYTRUSS" />
  <link id="apple-icon" rel="apple-touch-icon" sizes="512x512" href="" />
  <link rel="icon" type="image/webp" href="./images/skytruss.webp" />
  <link id="pwa-manifest" rel="manifest" href="" />
  <title>SKYTRUSS</title>

  <!-- Brand Typography: Orbitron & Roboto Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --cyberdyne-red: #DC1414;
      --cyberdyne-glow: rgba(220, 20, 20, 0.45);
      --galvanized-steel: #4A5568;
      --matte-iron: #292C34;
      --hud-white: #F0F0F0;
      --hazard-black: #0A0A0C;
      --font-header: 'Orbitron', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Roboto Mono', monospace;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--hazard-black);
      color: var(--hud-white);
      font-family: var(--font-mono);
    }

    input {
      user-select: text;
      -webkit-user-select: text;
      font-family: var(--font-mono);
      font-size: 16px !important; /* Prevents iOS Safari auto-zoom */
    }

    button {
      cursor: pointer;
      font-family: var(--font-header);
      border: none;
      font-weight: 800;
      min-height: 44px;
      transition: transform 0.12s ease, filter 0.15s ease, box-shadow 0.2s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .hidden {
      display: none !important;
    }

    /* ============================================================
       PORTRAIT IPHONE DEFAULT: FULL SCENE VISIBLE AT TOP (NO ZOOM)
       ============================================================ */
    #login-wall {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background-color: var(--hazard-black);
      padding:
        env(safe-area-inset-top)
        0
        calc(26px + env(safe-area-inset-bottom))
        0;
    }

    /* Hero banner showing the ENTIRE landscape image (Logo + Terminator) uncropped on portrait iPhone */
    .hero-artwork {
      position: relative;
      width: 100%;
      flex-shrink: 0;
    }

    .hero-artwork img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    /* Seamless fade from bottom edge of artwork into Hazard Black */
    .hero-artwork::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 45%;
      pointer-events: none;
      background: linear-gradient(180deg, transparent 0%, var(--hazard-black) 100%);
    }

    .login-stack {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 340px;
      padding: 0 22px;
      margin-top: -18px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    /* ============================================================
       LANDSCAPE / IPAD / DESKTOP: FULL-BLEED ART + LOWER-LEFT HUD
       ============================================================ */
    @media (min-width: 680px) {
      #login-wall {
        align-items: flex-start;
        justify-content: flex-end;
        background: url("./images/login.webp") center center / cover no-repeat;
        padding-left: clamp(28px, 5vw, 72px);
        padding-bottom: clamp(28px, 6vh, 60px);
      }

      #login-wall::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          circle at 20% 88%,
          rgba(10, 10, 12, 0.84) 0%,
          rgba(10, 10, 12, 0.38) 45%,
          transparent 75%
        );
        z-index: 1;
      }

      .hero-artwork {
        display: none;
      }

      .login-stack {
        max-width: 320px;
        padding: 0;
        margin-top: 0;
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--hud-white);
      opacity: 0.85;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.98);
      padding-left: 2px;
    }

    .field input {
      width: 100%;
      min-height: 45px;
      padding: 10px 13px;
      border-radius: 5px;
      background: rgba(18, 20, 26, 0.72);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border: 1px solid rgba(74, 85, 104, 0.65);
      color: var(--hud-white);
      outline: none;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.55);
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .field input::placeholder {
      color: rgba(240, 240, 240, 0.42);
    }

    .field input:focus {
      background: rgba(10, 10, 12, 0.88);
      border-color: var(--cyberdyne-red);
      box-shadow: 0 0 16px var(--cyberdyne-glow);
    }

    .btn-signin {
      width: 100%;
      margin-top: 4px;
      border-radius: 5px;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--hud-white);
      background: linear-gradient(180deg, #ef2323 0%, var(--cyberdyne-red) 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 22px var(--cyberdyne-glow);
    }

    .btn-signin:hover {
      filter: brightness(1.08);
    }

    .mode-toggle {
      background: none;
      border: none;
      min-height: 28px;
      padding: 2px;
      font-family: var(--font-mono);
      color: rgba(240, 240, 240, 0.78);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.4px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.98);
    }

    .mode-toggle span {
      color: var(--cyberdyne-red);
      font-weight: 700;
      text-decoration: underline;
    }

    .status-msg {
      font-family: var(--font-mono);
      font-size: 11px;
      min-height: 15px;
      text-align: center;
      letter-spacing: 0.3px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.98);
    }

    /* POST-LOGIN SHELL (TACTICAL HUD) */
    #main-scene {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background-color: var(--hazard-black);
      background-image:
        linear-gradient(rgba(74, 85, 104, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74, 85, 104, 0.12) 1px, transparent 1px);
      background-size: 28px 28px;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    .scene-topbar {
      height: 54px;
      padding: 0 16px;
      background: rgba(10, 10, 12, 0.94);
      border-bottom: 1px solid var(--galvanized-steel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .hud-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-header);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--hud-white);
    }

    .hud-brand img {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      border: 1px solid var(--cyberdyne-red);
    }

    .btn-ghost {
      background: var(--matte-iron);
      color: var(--hud-white);
      border: 1px solid var(--galvanized-steel);
      padding: 6px 12px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      min-height: 36px;
    }

    .main-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      overflow-y: auto;
    }

    .hud-panel {
      position: relative;
      max-width: 400px;
      width: 100%;
      padding: 24px 20px;
      background: rgba(41, 44, 52, 0.45);
      border: 1px solid var(--galvanized-steel);
    }

    .hud-panel::before {
      content: "";
      position: absolute;
      top: -1px;
      left: -1px;
      width: 14px;
      height: 14px;
      border-top: 2px solid var(--cyberdyne-red);
      border-left: 2px solid var(--cyberdyne-red);
    }
  </style>
</head>
<body>
  <!-- LOGIN WALL -->
  <div id="login-wall">
    <!-- Full uncropped artwork banner for portrait phones -->
    <div class="hero-artwork">
      <img src="./images/login.webp" alt="SKYTRUSS" />
    </div>

    <div class="login-stack">
      <div class="field">
        <label for="auth-email">EMAIL</label>
        <input type="email" id="auth-email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="field">
        <label for="auth-pass">PASSWORD</label>
        <input type="password" id="auth-pass" placeholder="Min 6 characters" autocomplete="current-password" />
      </div>

      <button class="btn-signin" id="auth-submit" onclick="handleAuth()">Sign In</button>

      <button type="button" class="mode-toggle" id="mode-toggle-btn" onclick="toggleAuthMode()">
        NO CREDENTIALS? <span>CREATE ACCOUNT</span>
      </button>

      <div class="status-msg" id="auth-status"></div>
    </div>
  </div>

  <!-- POST-LOGIN SHELL -->
  <div id="main-scene" class="hidden">
    <div class="scene-topbar">
      <div class="hud-brand">
        <img src="./images/skytruss.webp" alt="SKYTRUSS" />
        <span>SKYTRUSS</span>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="font-size:11px; color:var(--hud-white); opacity:0.75; max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" id="user-display-name"></span>
        <button class="btn-ghost" onclick="signOutUser()">Sign Out</button>
      </div>
    </div>

    <div class="main-body">
      <div class="hud-panel">
        <div style="font-family:var(--font-header); font-size:15px; letter-spacing:1.8px; color:var(--cyberdyne-red); margin-bottom:8px;">
          SYSTEM ONLINE
        </div>
        <p style="color:var(--hud-white); opacity:0.8; font-size:12px; line-height:1.6; margin:0;">
          AUTHENTICATED VIA SUPABASE. READY FOR MODULE CONSTRUCTION.
        </p>
      </div>
    </div>
  </div>

  <script>
    // CONVERT ./images/skytruss.webp TO 512x512 PNG FOR iOS SAFARI HOME SCREEN ICON
    (function setupPWAIconAndManifest() {
      const img = new Image();
      img.onload = function () {
        const c = document.createElement("canvas");
        c.width = 512;
        c.height = 512;
        const ctx = c.getContext("2d");
        ctx.drawImage(img, 0, 0, 512, 512);
        const pngUrl = c.toDataURL("image/png");

        const appleLink = document.getElementById("apple-icon");
        if (appleLink) appleLink.href = pngUrl;

        const manifest = {
          name: "SKYTRUSS",
          short_name: "SKYTRUSS",
          start_url: "./",
          display: "standalone",
          background_color: "#0A0A0C",
          theme_color: "#0A0A0C",
          icons: [{ src: pngUrl, sizes: "512x512", type: "image/png" }]
        };
        const manifestLink = document.getElementById("pwa-manifest");
        if (manifestLink) {
          manifestLink.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest));
        }
      };
      img.src = "./images/skytruss.webp";
    })();

    // SUPABASE CREDENTIALS
    const SUPABASE_URL = "https://fwpnbbkyhugzppclsgbl.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_QU5rvS7F-VfmocfgP1SqKw_gymqv9bQ";
    const sb = SUPABASE_URL.startsWith("http") ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    let authMode = "login";

    function toggleAuthMode() {
      authMode = authMode === "login" ? "signup" : "login";
      const isSignup = authMode === "signup";
      document.getElementById("auth-submit").textContent = isSignup ? "Create Account" : "Sign In";
      document.getElementById("auth-pass").setAttribute("autocomplete", isSignup ? "new-password" : "current-password");
      document.getElementById("mode-toggle-btn").innerHTML = isSignup
        ? 'EXISTING OPERATOR? <span>SIGN IN</span>'
        : 'NO CREDENTIALS? <span>CREATE ACCOUNT</span>';
      setStatus("");
    }

    function setStatus(msg, err = false) {
      const el = document.getElementById("auth-status");
      el.style.color = err ? "#DC1414" : "#4ade80";
      el.textContent = msg;
    }

    async function handleAuth() {
      if (!sb) return setStatus("ERR: MISSING SUPABASE KEYS", true);
      const email = document.getElementById("auth-email").value.trim();
      const password = document.getElementById("auth-pass").value;

      if (!email || password.length < 6) {
        return setStatus("ENTER VALID EMAIL & 6+ CHAR PASSWORD", true);
      }

      setStatus("AUTHENTICATING...");
      const res = authMode === "signup"
        ? await sb.auth.signUp({
            email,
            password,
            options: { data: { display_name: email.split("@")[0] } }
          })
        : await sb.auth.signInWithPassword({ email, password });

      if (res.error) return setStatus(res.error.message.toUpperCase(), true);
      if (res.data?.user) onSignedIn(res.data.user);
    }

    function onSignedIn(u) {
      if (!u) return;
      document.getElementById("user-display-name").textContent = (u.user_metadata?.display_name || u.email.split("@")[0]).toUpperCase();
      document.getElementById("login-wall").classList.add("hidden");
      document.getElementById("main-scene").classList.remove("hidden");
    }

    async function signOutUser() {
      if (sb) await sb.auth.signOut();
      document.getElementById("main-scene").classList.add("hidden");
      document.getElementById("login-wall").classList.remove("hidden");
      setStatus("");
    }

    // AUTO-RESTORE SESSION ON LAUNCH
    (async () => {
      if (!sb) return;
      const { data } = await sb.auth.getSession();
      if (data?.session?.user) onSignedIn(data.session.user);
    })();
  </script>
</body>
</html>
